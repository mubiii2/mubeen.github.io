<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PopIT | WebGL</title>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #0a0b0d;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #unity-container {
        width: 100%;
        height: 100%;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0b0d;
      }
      #unity-canvas {
        width: 100% !important;
        height: 100% !important;
        max-width: 100%;
        max-height: 100%;
        display: block;
        background: #14171d;
        cursor: default;
      }
      #unity-loading-bar {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 10;
        background: rgba(14, 17, 22, 0.94);
        padding: 1.5rem 2rem;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.65);
      }
      .loading-spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(255, 93, 115, 0.25);
        border-top-color: #ff5d73;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 12px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .loading-text {
        color: #f1f3f5;
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        margin-bottom: 10px;
      }
      #unity-progress-bar-empty {
        width: 200px;
        height: 6px;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 999px;
        overflow: hidden;
      }
      #unity-progress-bar-full {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #ff5d73, #ffc83d);
        border-radius: 999px;
        transition: width 0.15s ease;
      }
      #fullscreen-btn {
        position: absolute;
        bottom: 12px;
        right: 12px;
        background: rgba(18, 22, 28, 0.85);
        color: #f1f3f5;
        border: 1px solid rgba(255, 255, 255, 0.18);
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 0.75rem;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: all 0.2s;
        z-index: 5;
        backdrop-filter: blur(8px);
      }
      #fullscreen-btn:hover {
        background: rgba(30, 36, 46, 0.95);
        border-color: #ff5d73;
        color: #ff8597;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div class="loading-spinner"></div>
        <div class="loading-text" id="loadingText">LOADING POP IT! (0%)</div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <button type="button" id="fullscreen-btn" title="Toggle Fullscreen">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        <span>FULLSCREEN</span>
      </button>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var loadingText = document.querySelector("#loadingText");
      var fullscreenBtn = document.querySelector("#fullscreen-btn");

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Build.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Build.data",
        frameworkUrl: buildUrl + "/Build.framework.js",
        codeUrl: buildUrl + "/Build.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "PopIT",
        productVersion: "1.0",
        showBanner: function() {},
      };

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          var pct = Math.round(100 * progress);
          progressBarFull.style.width = pct + "%";
          loadingText.textContent = "LOADING POP IT! (" + pct + "%)";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
          fullscreenBtn.onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          loadingText.textContent = "ERROR LOADING GAME";
          console.error(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
